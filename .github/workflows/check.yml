name: Kosmos Randevu Kontrolü

on:
  schedule:
    # Her 5 dakikada bir dener (GitHub Actions'ın pratikte izin verdiği
    # en sık aralık budur; yoğunlukta birkaç dakika gecikebilir)
    - cron: "*/5 * * * *"
  workflow_dispatch:  # GitHub üzerinden "Run workflow" ile elle de tetikleyebilirsiniz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install requests

      - name: Kontrolü çalıştır
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python app.py --once
